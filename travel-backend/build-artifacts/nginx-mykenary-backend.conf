server {
  listen 80;
  server_name _; # ganti ke IP/domain: 72.60.78.22 atau nama domain

  # Opsional: batas ukuran upload
  client_max_body_size 20m;

  # Proxy subpath API ke backend NestJS di port 3006
  location ^~ /mykenary-backend/api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket (jika diperlukan)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Penting: trailing slash agar path diteruskan dengan benar
    proxy_pass http://127.0.0.1:3006/;

    # CORS (opsional, jika frontend beda origin)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    if ($request_method = OPTIONS) { return 204; }
  }
}